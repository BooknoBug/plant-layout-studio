<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plant Layout Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Plant Layout Studio<small id="src">ผังพื้นอาคารผลิต · หน่วยเมตร</small></h1>
    <div class="sp"></div>
    <button id="collab" class="collab" hidden title="งานร่วม: ใครเปิดอยู่ และสถานะการบันทึก"></button>
    <div class="seg" role="group" aria-label="มุมมอง">
      <button id="v2" aria-pressed="true">ผัง</button>
      <button id="v3" aria-pressed="false">3 มิติ</button>
    </div>
    <button class="ibtn" id="qsave" title="บันทึก draft (Ctrl+S)" aria-label="บันทึก draft">💾</button>
    <button class="ibtn" id="undo" title="ย้อนกลับ" aria-label="ย้อนกลับ">↶</button>
    <button class="ibtn" id="redo" title="ทำซ้ำ" aria-label="ทำซ้ำ">↷</button>
    <button class="ibtn" id="menu" aria-label="เมนู">⋯</button>
  </header>
  <div id="plants" role="tablist" aria-label="Plant" hidden></div>
  <div id="tools" role="toolbar" aria-label="เครื่องมือ"></div>
  <div id="ctx"></div>
  <div id="work">
    <div id="stage">
      <canvas id="c2"></canvas>
      <canvas id="c3"></canvas>
      <div class="float">
        <button id="zin" aria-label="ขยาย">+</button>
        <button id="zout" aria-label="ย่อ">−</button>
        <button id="fit" aria-label="พอดีหน้าจอ">⤢</button>
        <button id="bgtog" aria-label="เปิด/ปิดพื้นหลัง" aria-pressed="true" title="ซ่อนพื้นหลัง">🗺</button>
      </div>
      <div id="legend"></div>
      <div id="scalebar"></div>
      <div id="toast"></div>
    </div>
    <aside id="dock">
      <div id="tabs" role="tablist">
        <button role="tab" data-tab="props" aria-selected="true">คุณสมบัติ</button>
        <button role="tab" data-tab="layers" aria-selected="false">แบบพื้นหลัง</button>
        <button role="tab" data-tab="checks" aria-selected="false">ตรวจ <span class="badge z" id="nchk">0</span></button>
        <button role="tab" data-tab="sum" aria-selected="false">สรุป GMP</button>
        <button role="tab" data-tab="list" aria-selected="false">รายการ</button>
      </div>
      <div id="pane"></div>
    </aside>
  </div>
</div>

<dialog id="dlg"></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>
<input type="file" id="lfile" accept=".json,application/json" hidden>
<!-- dev page: open through a web server (GitHub Pages /src/ or `python3 -m http.server`). The built single file is ../index.html -->
<script>window.UNDERLAY_URL='../layouts/PD2-floor2.layout.json';/* dev only, if the file exists locally */</script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="collab.js"></script>
</body>
</html>
